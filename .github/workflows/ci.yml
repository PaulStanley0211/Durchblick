name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://durchblick:durchblick@localhost:5432/durchblick_test
      SUPABASE_URL: http://localhost
      SUPABASE_ANON_KEY: ci-placeholder
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: durchblick_test
          POSTGRES_USER: durchblick
          POSTGRES_PASSWORD: durchblick
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: api
        run: uv sync

      - name: Ruff
        working-directory: api
        run: uv run ruff check app/ tests/

      - name: Pyright
        working-directory: api
        run: uv run pyright app/

      - name: Run migrations
        working-directory: api
        run: uv run alembic upgrade head

      - name: Pytest
        working-directory: api
        run: uv run pytest --cov=app/tax --cov=app.repositories.tax_constants --cov-fail-under=100

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Prettier check
        run: npx --prefix web prettier --check .
